# Render blueprint — one Python web service serving both the API and the UI.
#
# No Docker and no Node required at deploy time: frontend/dist is built
# locally and committed, so this service only has to serve it. Rebuild and
# commit dist/ after changing anything under frontend/src.
#
# Deploy: on render.com choose New > Blueprint and point it at this repo.
services:
  - type: web
    name: resume-job-agent
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Required — set this in the Render dashboard, never commit it.
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: GREENHOUSE_COMPANY_SLUGS
        value: airbnb,stripe,figma,dropbox,anthropic

      # Applicant details used when filling forms. Use your FULL name —
      # a single word leaves the required surname field as ".".
      - key: APPLICANT_NAME
        sync: false
      - key: APPLICANT_EMAIL
        sync: false
      - key: APPLICANT_PHONE
        sync: false

# Note: applying to jobs does NOT work on this service. It needs the webcmd
# CLI plus a real Chromium, which the Python runtime has not got, so
# /api/apply returns a clear "webcmd is not installed" error. Parsing,
# discovery and ranking all work. Run the apply step locally, or deploy the
# included Dockerfile on a paid instance instead.
